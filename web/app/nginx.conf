server {
    # Rendered by the nginx image's envsubst entrypoint; $PORT comes from the
    # container env (Railway injects it, Dockerfile defaults it to 80).
    listen ${PORT};
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
