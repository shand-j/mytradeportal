server {
    # Rendered by the nginx image's envsubst entrypoint; $PORT comes from the
    # container env (Railway injects it, Dockerfile defaults it to 80).
    listen ${PORT};
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Resolve the API upstream lazily at request time instead of at startup.
    # Using a variable in proxy_pass (with an explicit resolver) means nginx
    # boots and serves the SPA even when the API service's private domain is
    # not yet resolvable — a transient but real condition on Railway when the
    # web container starts before the API. A hardcoded hostname here would make
    # nginx abort with "host not found in upstream" and the whole site would be
    # down with no request logs. ${NGINX_LOCAL_RESOLVERS} is populated by the
    # nginx image entrypoint from /etc/resolv.conf (needs the Dockerfile's
    # NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1).
    location ~ ^/api/(?<api_path>.*)$ {
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
        resolver_timeout 5s;

        set $api_upstream ${API_UPSTREAM_URL};

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_pass $api_upstream/$api_path$is_args$args;
    }
}
