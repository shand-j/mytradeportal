[project]
name = "engineering-orchestrator"
version = "0.1.0"
description = "Policy-gated autonomous engineering orchestration with CrewAI, Kimi Code CLI, and Railway"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=1.15.44,<2.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg2-binary>=2.9.9",
    "PyJWT>=2.10.0",
    "cryptography>=43.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0,<2.2.0",
]

[project.scripts]
kickoff = "engineering_orchestrator.main:kickoff"
run_crew = "engineering_orchestrator.main:kickoff"
plot = "engineering_orchestrator.main:plot"
run_with_trigger = "engineering_orchestrator.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "b1c235b4-939b-4f25-8347-691e229fd132"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:crewai.*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
