name: Guarded Autonomous Hotfix

on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      service:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      branch:
        required: true
        type: string
      staging_health_url:
        required: true
        type: string
      production_health_url:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: guarded-hotfix-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mtp
          POSTGRES_PASSWORD: mtp
          POSTGRES_DB: mtp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mtp" --health-interval 10s
          --health-timeout 5s --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.11.5
        ports:
          - 6333:6333
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://mtp:mtp@localhost:5432/mtp
      QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
      - name: Validate the immutable hotfix request
        env:
          RUN_ID: ${{ inputs.run_id }}
          SERVICE: ${{ inputs.service }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BRANCH: ${{ inputs.branch }}
          STAGING_HEALTH_URL: ${{ inputs.staging_health_url }}
          PRODUCTION_HEALTH_URL: ${{ inputs.production_health_url }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9a-f-]{36}$ ]]
          [[ "$BRANCH" == "hotfix/$RUN_ID" ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$STAGING_HEALTH_URL" == https://* ]]
          [[ "$PRODUCTION_HEALTH_URL" == https://* ]]
          case "$SERVICE" in api|admin|data-pipeline|web|landing) ;; *) exit 1 ;; esac
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]]
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if echo "$changed" | grep -Eq '(^|/)(\.env|migrations|auth|payments|billing|stripe|paddle)(/|$)|^\.github/|^\.railway/|^scripts/ci/|^services/engineering_orchestrator/'; then
            echo "::error::Hotfix touches a prohibited path"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run repository quality gates
        run: |
          ruff check .
          ruff format --check .
          mypy services/api packages/shared/py
          mypy --config-file mypy-admin.ini services/admin
          pytest --cov-fail-under=70
      - name: Verify isolated orchestrator
        working-directory: services/engineering_orchestrator
        run: |
          python -m pip install uv
          uv sync
          uv run mypy src
          uv run pytest -o addopts='' --cov=engineering_orchestrator --cov-fail-under=70

  staging:
    needs: verify
    runs-on: ubuntu-latest
    environment: MyTradePortal / staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy hotfix to staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: |
          railway up --project "$RAILWAY_PROJECT_ID" --environment staging \
            --service "${{ inputs.service }}" --ci \
            -m "Hotfix ${{ inputs.run_id }} staged from ${{ inputs.head_sha }}"
      - name: Verify staging health
        run: |
          for attempt in $(seq 1 30); do
            curl -fsS --max-time 10 "${{ inputs.staging_health_url }}" && exit 0
            sleep 10
          done
          exit 1

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: MyTradePortal / production
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy hotfix to production
        id: deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: |
          railway up --project "$RAILWAY_PROJECT_ID" --environment production \
            --service "${{ inputs.service }}" --ci \
            -m "Guarded hotfix ${{ inputs.run_id }} from ${{ inputs.head_sha }}"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Verify production recovery
        run: |
          for attempt in $(seq 1 30); do
            curl -fsS --max-time 10 "${{ inputs.production_health_url }}" && exit 0
            sleep 10
          done
          exit 1

  rollback:
    needs: production
    if: always() && needs.production.result == 'failure' && needs.production.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    environment: MyTradePortal / production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Remove the failed hotfix deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: |
          railway down --project "$RAILWAY_PROJECT_ID" --environment production \
            --service "${{ inputs.service }}" --yes
      - name: Verify the previous deployment responds
        run: |
          for attempt in $(seq 1 30); do
            curl -fsS --max-time 10 "${{ inputs.production_health_url }}" && exit 0
            sleep 10
          done
          exit 1
