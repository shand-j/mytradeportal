name: Staging E2E

# Regression safety net against the persistent Railway "staging" environment
# (a fork of production). Runs on every push to main — staging auto-deploys
# from main, so this catches regressions in the fully deployed stack. See
# docs/ci-pr-environments.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never cancel an in-flight staging run: it is the pre-production safety
  # net and its results must be attributable to exactly one deploy.
  group: staging-e2e
  cancel-in-progress: false

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}

jobs:
  staging-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest httpx

      - name: Resolve staging environment URLs
        id: staging-env
        run: scripts/ci/env_url.sh staging | tee -a "$GITHUB_OUTPUT"

      # The push triggers a staging rebuild; assert against the new image,
      # never the previous deployment (a stale race failed this suite on
      # 2026-09-16 with errors only explainable by old code).
      - name: Wait for fresh api deployment
        run: python3 scripts/ci/wait_for_deploy.py staging api 1200

      - name: Wait for deployed API health
        run: |
          API_URL="${{ steps.staging-env.outputs.api_url }}"
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 10 "$API_URL/health"; then
              echo "API is healthy: $API_URL"
              exit 0
            fi
            echo "Attempt ${attempt}/60: $API_URL/health not ready — sleeping 15s"
            sleep 15
          done
          echo "::error::$API_URL/health did not become ready within 15 minutes."
          exit 1

      - name: Deployed-API smoke suite
        id: api-smoke
        env:
          TEST_API_BASE_URL: ${{ steps.staging-env.outputs.api_url }}
          TEST_SETUP_TOKEN: "" # keep the deployed smoke read-only: no writes, no background AI drafts
        run: python -m pytest services/api/tests_deployed -o addopts='' -v

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        # Hoisted node_modules: the playwright bin lives in the workspace-root
        # .bin and is only resolvable via `pnpm exec` from the root (pnpm exec
        # from a member package does not fall back to the root .bin).
        run: pnpm exec playwright install chromium

      - name: Landing/portal smoke (Playwright, chromium)
        id: landing-smoke
        env:
          TEST_LANDING_URL: ${{ steps.staging-env.outputs.landing_url }}
        # testDir is resolved relative to the config file, so this works from root.
        run: pnpm exec playwright test --config web/app/playwright.pr.config.ts

      - name: Mobile regression against staging API (Playwright, chromium)
        id: mobile-regression
        env:
          E2E_API_BASE_URL: ${{ steps.staging-env.outputs.api_url }}
          E2E_STAGING_SETUP_TOKEN: ${{ secrets.E2E_STAGING_SETUP_TOKEN }}
          # Staging email routes to the shared Mailpit instance (see
          # docs/ci-pr-environments.md), so E2E can assert that customer/
          # tenant emails were sent and inspect their contents — at zero
          # Resend cost.
          MAILPIT_URL: ${{ secrets.MAILPIT_URL }}
          MAILPIT_BASIC_AUTH: ${{ secrets.MAILPIT_BASIC_AUTH }}
          # Single worker: a remote API (Supabase auth latency) plus video
          # recording makes 2-worker runs exceed the specs' 20-30s render
          # waits (observed as C12/F/N2 flakes on the first staging run).
          # Serial also eases LLM rate pressure.
          E2E_WORKERS: "1"
        # Config path is relative to the invocation dir; testDir/globalSetup
        # resolve relative to the config file.
        run: pnpm exec playwright test --config mobile/playwright.config.staging.ts

      - name: Upload mobile test results (screenshots, videos, page snapshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results
          path: mobile/test-results
          retention-days: 7

  deployed-write-suite:
    # Stateful API coverage against throwaway tenants on staging: paywall
    # transitions, Stripe Connect + forged card-payment/refund webhooks,
    # Paddle subscription sync, trial extension, Resend bounce alerts,
    # customer magic links, data export. Requires the setup token and the
    # environment's webhook secrets, so it runs only here — pr-verify stays
    # read-only and skips every deployed_write test.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest httpx

      - name: Resolve staging environment URLs
        id: staging-env
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: scripts/ci/env_url.sh staging | tee -a "$GITHUB_OUTPUT"

      - name: Resolve webhook secrets from the staging api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: |
          # Test-side secrets needed to forge webhook signatures the api will
          # accept; read straight from the staging api service (never stored
          # in GitHub secrets, so rotations can't drift).
          python3 scripts/ci/env_secrets.py staging api \
            --prefix TEST_ \
            STRIPE_WEBHOOK_SECRET PADDLE_WEBHOOK_SECRET RESEND_WEBHOOK_SECRET \
            PADDLE_PRICE_ID_PRO_MONTH >> "$GITHUB_ENV"

      # Same stale-deploy race as staging-verify: the write suite mutates
      # state, so asserting against the previous image would be worse than
      # useless — it would report the new commit's tests against old code.
      - name: Wait for fresh api deployment
        run: python3 scripts/ci/wait_for_deploy.py staging api 1200

      - name: Wait for deployed API health
        run: |
          API_URL="${{ steps.staging-env.outputs.api_url }}"
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 10 "$API_URL/health"; then
              echo "API is healthy: $API_URL"
              exit 0
            fi
            echo "Attempt ${attempt}/60: $API_URL/health not ready — sleeping 15s"
            sleep 15
          done
          echo "::error::$API_URL/health did not become ready within 15 minutes."
          exit 1

      - name: Deployed write suite (throwaway tenants)
        env:
          TEST_API_BASE_URL: ${{ steps.staging-env.outputs.api_url }}
          TEST_SETUP_TOKEN: ${{ secrets.E2E_STAGING_SETUP_TOKEN }}
          MAILPIT_URL: ${{ secrets.MAILPIT_URL }}
          MAILPIT_BASIC_AUTH: ${{ secrets.MAILPIT_BASIC_AUTH }}
        run: python -m pytest services/api/tests_deployed -m deployed_write -o addopts='' -v
