name: PR Verify

# Verifies every PR against its Railway PR environment (a copy of production
# that Railway's GitHub integration creates per PR), so main can be locked
# behind passing CI. See docs/ci-pr-environments.md.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number whose Railway PR environment should be verified"
        required: true
        type: string

concurrency:
  group: pr-verify-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.ref }}
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}

jobs:
  quality-gates:
    # Same setup as the python job in ci.yml: in-process pytest against
    # service containers. No live LLM/Paddle access exists here, so these
    # tests run purely on fixtures/mocks (identical to the existing CI job).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mtp
          POSTGRES_PASSWORD: mtp
          POSTGRES_DB: mtp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mtp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.11.5
        ports:
          - 6333:6333
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://mtp:mtp@localhost:5432/mtp
      QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: |
          mypy services/api packages/shared/py
          mypy --config-file mypy-admin.ini services/admin

      - name: Test with pytest
        run: pytest

  pr-env-verify:
    # Discover the PR's Railway environment, wait for the api deploy to become
    # healthy, then run the deployed-API smoke suite and a light Playwright
    # pass over the landing/portal bundle.
    needs: quality-gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post the verification comment
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # The CLI's linked-project config (.railway/config.json) is gitignored,
      # so CI must pin the project explicitly for non-interactive calls.
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      TEST_SETUP_TOKEN: "" # never set in CI: no writes, no background AI drafts
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest httpx

      # Railway creates the PR environment when the PR opens, but the deploy
      # can take several minutes — retry discovery + health until both are up
      # (total budget ~15 min).
      - name: Resolve PR environment URLs
        id: pr-env
        run: |
          echo "Resolving Railway PR environment for PR #${PR_NUMBER}..."
          for attempt in $(seq 1 30); do
            if urls=$(scripts/ci/pr_env_url.sh "${PR_NUMBER}"); then
              echo "$urls" | tee -a "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt ${attempt}/30: PR environment not ready yet — sleeping 30s"
            sleep 30
          done
          echo "::error::Railway PR environment for PR #${PR_NUMBER} did not appear within 15 minutes."
          exit 1

      - name: Route PR environment email to Mailpit
        # PR environments are throwaway forks of production, which would
        # otherwise send real email through Resend during E2E (cost + quota).
        # Repoint the PR api at the shared staging Mailpit instance over its
        # public SMTP endpoint (auth-enabled; Mailpit never relays onward).
        # Uses raw GraphQL like pr_env_url.sh: the Railway CLI rejects the
        # project token used in CI. Skipped when URL overrides point the run
        # at a hand-built env without an id.
        if: steps.pr-env.outputs.env_id != ''
        env:
          MAILPIT_SMTP: ${{ secrets.MAILPIT_SMTP }}
          MAILPIT_BASIC_AUTH: ${{ secrets.MAILPIT_BASIC_AUTH }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: python3 scripts/ci/route_env_email.py "${{ steps.pr-env.outputs.env_id }}"

      - name: Wait for deployed API health
        run: |
          API_URL="${{ steps.pr-env.outputs.api_url }}"
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 10 "$API_URL/health"; then
              echo "API is healthy: $API_URL"
              exit 0
            fi
            echo "Attempt ${attempt}/60: $API_URL/health not ready — sleeping 15s"
            sleep 15
          done
          echo "::error::$API_URL/health did not become ready within 15 minutes."
          exit 1

      - name: Deployed-API smoke suite
        id: api-smoke
        env:
          TEST_API_BASE_URL: ${{ steps.pr-env.outputs.api_url }}
        run: python -m pytest services/api/tests_deployed -o addopts='' -v

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        # Hoisted node_modules: the playwright bin lives in the workspace-root
        # .bin and is only resolvable via `pnpm exec` from the root (pnpm exec
        # from a member package does not fall back to the root .bin).
        run: pnpm exec playwright install chromium

      - name: Landing/portal smoke (Playwright, chromium)
        id: landing-smoke
        env:
          TEST_LANDING_URL: ${{ steps.pr-env.outputs.landing_url }}
        # testDir is resolved relative to the config file, so this works from root.
        run: pnpm exec playwright test --config web/app/playwright.pr.config.ts

      - name: Comment results on the PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_SMOKE: ${{ steps.api-smoke.conclusion }}
          LANDING_SMOKE: ${{ steps.landing-smoke.conclusion }}
        run: |
          result() { [ "$1" = "success" ] && echo "✅ passed" || echo "❌ $1"; }
          BODY="## PR environment verification
          - API: ${{ steps.pr-env.outputs.api_url }}
          - Landing: ${{ steps.pr-env.outputs.landing_url }}
          - Deployed-API smoke suite: $(result "$API_SMOKE")
          - Playwright landing smoke: $(result "$LANDING_SMOKE")
          - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh pr comment "${PR_NUMBER}" --body "$BODY" --repo "${{ github.repository }}"
