name: Pnpm Debug
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/pnpm-debug.yml"]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Diagnose playwright bin
        run: |
          echo "== pwd =="; pwd
          echo "== root .bin playwright =="; ls -la node_modules/.bin/ | grep -i play || echo "MISSING at root .bin"
          echo "== root @playwright =="; ls -la node_modules/@playwright 2>/dev/null || echo "MISSING root @playwright"
          echo "== web/app node_modules =="; ls web/app/node_modules/ 2>/dev/null | head -20
          echo "== web/app/.bin =="; ls web/app/node_modules/.bin 2>/dev/null | grep -i play || echo "MISSING web/app .bin"
          echo "== pnpm why playwright =="; pnpm --filter my-app why @playwright/test 2>&1 | head -10 || true
          echo "== exec from root =="; pnpm exec playwright --version 2>&1 | tail -2 || true
          echo "== exec from web/app =="; cd web/app && pnpm exec playwright --version 2>&1 | tail -2 || true
