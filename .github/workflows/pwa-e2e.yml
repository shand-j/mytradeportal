name: Mobile E2E

# Connected-mode end-to-end smoke for the Expo mobile app (services/pwa). Brings
# up the API stack in Docker, seeds the demo tenant + data, then drives the app
# (served as web) with Playwright: trade login -> live dashboard/quotes/jobs,
# business onboarding -> real tenant, and white-label branding from public config.

on:
  push:
    branches: [main]
    paths:
      - "services/pwa/**"
      - "services/api/**"
      - "packages/shared/py/**"
      - "docker-compose.yml"
      - "docker-compose.e2e.yml"
      - ".github/workflows/pwa-e2e.yml"
  pull_request:
    paths:
      - "services/pwa/**"
      - "services/api/**"
      - "packages/shared/py/**"
      - "docker-compose.yml"
      - "docker-compose.e2e.yml"
      - ".github/workflows/pwa-e2e.yml"
  workflow_dispatch:

concurrency:
  group: pwa-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright chromium
        run: pnpm --dir services/pwa exec playwright install --with-deps chromium

      - name: Run mobile connected-mode E2E
        run: bash services/pwa/e2e/run.sh

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts
          path: |
            services/pwa/test-results
            services/pwa/playwright-report
          if-no-files-found: ignore

      - name: Dump API logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color api | tail -n 200
