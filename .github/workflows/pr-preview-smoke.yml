name: PR Preview Smoke Test

on:
  deployment_status:

concurrency:
  group: pr-preview-smoke-${{ github.event.deployment.environment || github.event.deployment_status.environment }}
  cancel-in-progress: true

jobs:
  smoke-pr-preview:
    if: ${{ github.event.deployment_status.state == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web/app
    env:
      PREVIEW_ENV_ID: ${{ github.event.deployment.payload.environmentId || github.event.deployment.payload.environmentid }}
      RAILWAY_PROJECT_ID: 30feaeee-9464-41ac-9b17-d07ae4cfcd09
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_PREVIEW_TOKEN || secrets.RAILWAY_TOKEN }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_PREVIEW_TOKEN || secrets.RAILWAY_TOKEN }}
      DEPLOYMENT_ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url || '' }}
      DEPLOYMENT_TARGET_URL: ${{ github.event.deployment_status.target_url || '' }}
      DEPLOYMENT_SHA: ${{ github.event.deployment.sha || '' }}
      E2E_DJANGO_ADMIN_USERNAME: ${{ secrets.E2E_DJANGO_ADMIN_USERNAME || 'superadmin' }}
      E2E_DJANGO_ADMIN_PASSWORD: ${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
      E2E_ARTIFACT_DIR: playwright/.tmp
    steps:
      - uses: actions/checkout@v4

      - name: Log deployment trigger
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "Preview environment ID: ${PREVIEW_ENV_ID:-unknown}"
          echo "Deployment SHA: ${DEPLOYMENT_SHA:-unknown}"
          echo "Deployment target URL: ${DEPLOYMENT_TARGET_URL:-unknown}"
          echo "Deployment environment URL: ${DEPLOYMENT_ENVIRONMENT_URL:-unknown}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            services/**/requirements.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/app/pnpm-lock.yaml

      - name: Cache Railway CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: railway-cli-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            railway-cli-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/app/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Railway CLI
        run: |
          set -euxo pipefail
          echo "+ npm install -g @railway/cli"
          npm install -g @railway/cli
          echo "+ railway --version"
          railway --version

      - name: Install smoke dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -e "./[dev]"
          pnpm --dir web/app install --frozen-lockfile
          pnpm --dir web/app exec playwright install chromium

      - name: Resolve preview URLs
        working-directory: .
        run: |
          set -euxo pipefail

          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "ERROR: Missing Railway token. Set RAILWAY_PREVIEW_TOKEN or RAILWAY_TOKEN." >&2
            exit 1
          fi

          if [ -z "${PREVIEW_ENV_ID:-}" ]; then
            echo "ERROR: Preview environment ID is missing from deployment payload." >&2
            exit 1
          fi

          RAW_PREVIEW_ENV_ID="$PREVIEW_ENV_ID"

          echo "+ railway api 'query getProject($id: String!) { project(id: $id) { environments { edges { node { id name } } } } }' --variables '{\"id\":\"$RAILWAY_PROJECT_ID\"}'"
          railway api 'query getProject($id: String!) { project(id: $id) { environments { edges { node { id name } } } } }' \
            --variables "{\"id\":\"$RAILWAY_PROJECT_ID\"}" | tee /tmp/railway-environments.json

          PREVIEW_ENV=$(python - <<'PY'
          import json
          import os
          import sys

          target_id = os.environ.get("RAW_PREVIEW_ENV_ID", "").strip().lower()
          with open('/tmp/railway-environments.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          def walk(node):
              if isinstance(node, dict):
                  yield node
                  for value in node.values():
                      yield from walk(value)
              elif isinstance(node, list):
                  for value in node:
                      yield from walk(value)

          for obj in walk(data):
              env_id = obj.get('id') if isinstance(obj, dict) else None
              env_name = obj.get('name') if isinstance(obj, dict) else None
              if isinstance(env_id, str) and isinstance(env_name, str) and env_id.lower() == target_id:
                  print(env_name)
                  sys.exit(0)

          sys.exit(1)
          PY
          ) || {
            echo "ERROR: Could not map environment ID '$RAW_PREVIEW_ENV_ID' to an environment name." >&2
            exit 1
          }

          echo "Resolved environment ID '$RAW_PREVIEW_ENV_ID' to name '$PREVIEW_ENV'"

          echo "+ railway status --project $RAILWAY_PROJECT_ID --environment $PREVIEW_ENV --json"
          railway status --project "$RAILWAY_PROJECT_ID" --environment "$PREVIEW_ENV" --json | tee /tmp/railway-status.json

          URLS=$(python - <<'PY'
          import json

          with open('/tmp/railway-status.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          web = ""
          admin = ""

          def domain_from(node):
              domains = node.get('domains') if isinstance(node, dict) else None
              if not isinstance(domains, dict):
                  return ""
              for key in ('serviceDomains', 'customDomains'):
                  values = domains.get(key) or []
                  if not isinstance(values, list):
                      continue
                  for item in values:
                      if isinstance(item, dict):
                          for field in ('domain', 'hostname', 'name'):
                              val = item.get(field)
                              if isinstance(val, str) and val:
                                  return val
                      elif isinstance(item, str) and item:
                          return item
              return ""

          def walk(node):
              if isinstance(node, dict):
                  yield node
                  for value in node.values():
                      yield from walk(value)
              elif isinstance(node, list):
                  for value in node:
                      yield from walk(value)

          for obj in walk(data):
              if not isinstance(obj, dict):
                  continue
              name = obj.get('serviceName')
              if name == 'web' and not web:
                  web = domain_from(obj)
              if name == 'admin' and not admin:
                  admin = domain_from(obj)

          print(f"{web}|{admin}")
          PY
          )

          WEB_DOMAIN="${URLS%%|*}"
          ADMIN_DOMAIN="${URLS##*|}"

          if [ -z "$WEB_DOMAIN" ] || [ -z "$ADMIN_DOMAIN" ]; then
            echo "ERROR: Could not resolve web/admin domains for '$PREVIEW_ENV'." >&2
            exit 1
          fi

          WEB_URL="https://$WEB_DOMAIN"
          ADMIN_URL="https://$ADMIN_DOMAIN"

          echo "E2E_BASE_URL=$WEB_URL" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_BASE_URL=$ADMIN_URL" >> "$GITHUB_ENV"
          echo "Resolved preview URLs: $WEB_URL and $ADMIN_URL"

      - name: Run PR preview smoke test
        run: pnpm exec playwright test --config=playwright.config.prod-smoke.ts --retries=1

      - name: Upload preview smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-smoke-artifacts
          path: |
            web/app/playwright/.tmp
            web/app/test-results
          if-no-files-found: ignore
