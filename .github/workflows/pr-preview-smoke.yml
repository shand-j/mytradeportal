name: PR Preview Smoke Test

on:
  deployment_status:

concurrency:
  group: pr-preview-smoke-${{ github.event.deployment.environment || github.event.deployment_status.environment }}
  cancel-in-progress: true

jobs:
  smoke-pr-preview:
    if: ${{ github.event.deployment_status.state == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web/app
    env:
      PREVIEW_ENV_LABEL: ${{ github.event.deployment.environment || github.event.deployment_status.environment || '' }}
      DEPLOYMENT_ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url || '' }}
      DEPLOYMENT_TARGET_URL: ${{ github.event.deployment_status.target_url || '' }}
      DEPLOYMENT_SHA: ${{ github.event.deployment.sha || '' }}
      E2E_DJANGO_ADMIN_USERNAME: ${{ secrets.E2E_DJANGO_ADMIN_USERNAME || 'superadmin' }}
      E2E_DJANGO_ADMIN_PASSWORD: ${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
      E2E_ARTIFACT_DIR: playwright/.tmp
    steps:
      - uses: actions/checkout@v4

      - name: Log deployment trigger
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "Preview environment label: ${PREVIEW_ENV_LABEL:-unknown}"
          echo "Deployment SHA: ${DEPLOYMENT_SHA:-unknown}"
          echo "Deployment target URL: ${DEPLOYMENT_TARGET_URL:-unknown}"
          echo "Deployment environment URL: ${DEPLOYMENT_ENVIRONMENT_URL:-unknown}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            services/**/requirements.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/app/pnpm-lock.yaml

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/app/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install smoke dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -e "./[dev]"
          pnpm --dir web/app install --frozen-lockfile
          pnpm --dir web/app exec playwright install chromium

      - name: Resolve preview URLs
        working-directory: .
        run: |
          set -euxo pipefail

          if [ -z "${PREVIEW_ENV_LABEL:-}" ]; then
            echo "ERROR: Preview environment label is missing from deployment event." >&2
            exit 1
          fi

          PR_NUMBER="$(printf '%s' "$PREVIEW_ENV_LABEL" | sed -nE 's|.*pr-([0-9]+).*|\1|p' | head -n1)"
          if [ -z "$PR_NUMBER" ]; then
          echo "ERROR: Could not extract PR number from preview environment label '$PREVIEW_ENV_LABEL'." >&2
            exit 1
          fi

          PREVIEW_SUFFIX="mytradeportal-pr-$PR_NUMBER"
          WEB_URL="https://web-$PREVIEW_SUFFIX.up.railway.app"
          ADMIN_URL="https://admin-$PREVIEW_SUFFIX.up.railway.app"

          echo "E2E_BASE_URL=$WEB_URL" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_BASE_URL=$ADMIN_URL" >> "$GITHUB_ENV"
          echo "Resolved preview URLs from pattern: $WEB_URL and $ADMIN_URL"

      - name: Run PR preview smoke test
        run: pnpm exec playwright test --config=playwright.config.prod-smoke.ts --retries=1

      - name: Upload preview smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-smoke-artifacts
          path: |
            web/app/playwright/.tmp
            web/app/test-results
          if-no-files-found: ignore
