name: CI
## FIXME: This workflow was a wrongful implementation of what shout have been dev only kimi agentic pen-test workflow. It is now deprecated and should be removed once the agentic-pen-test workflow is fully functional and tested.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mtp
          POSTGRES_PASSWORD: mtp
          POSTGRES_DB: mtp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mtp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.11.5
        ports:
          - 6333:6333
    env:
      DATABASE_URL: postgresql+asyncpg://mtp:mtp@localhost:5432/mtp
      QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: |
          mypy services/api packages/shared/py
          mypy --config-file mypy-admin.ini services/admin

      - name: Test with pytest
        run: pytest

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  preview-e2e:
    # For pull requests, validate against an ephemeral Railway PR Environment
    # instead of deploying to production. Requires PR Environments to be
    # enabled in Railway project settings.
    needs: [python, typescript]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/app/pnpm-lock.yaml

      - name: Cache Railway CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: railway-cli-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            railway-cli-${{ runner.os }}-

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Install test dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -e "./[dev]"
          pnpm --dir web/app install --frozen-lockfile
          pnpm --dir web/app exec playwright install chromium

      - name: Resolve Railway PR environment and preview URLs
        working-directory: .
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          # Project ID for MyTradePortal in Railway; update if the project is recreated.
          RAILWAY_PROJECT_ID: 30feaeee-9464-41ac-9b17-d07ae4cfcd09
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          railway link --project "$RAILWAY_PROJECT_ID" --json >/tmp/railway-link.json
          railway environment list --json > /tmp/railway-envs.json

            PREVIEW_ENV=$(python - <<'PY'
            import json, os, re

            pr_number = os.environ["PR_NUMBER"]

            with open('/tmp/railway-envs.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

            items = data if isinstance(data, list) else data.get('environments', []) if isinstance(data, dict) else []

            def get_name(item):
              if isinstance(item, dict):
                return item.get('name') or item.get('environmentName') or ''
              return ''

            names = [get_name(i) for i in items if get_name(i)]

            pat = re.compile(rf"\bpr[-_ ]*#?{re.escape(pr_number)}\b", re.IGNORECASE)
            matches = [n for n in names if pat.search(n)]

            if len(matches) == 1:
              print(matches[0])
            elif len(matches) > 1:
              # Deterministic pick when duplicates exist.
              print(sorted(matches)[0])
            else:
              print("")
            PY
            )

          if [ -z "$PREVIEW_ENV" ]; then
            echo "ERROR: Could not resolve Railway PR environment for PR #$PR_NUMBER." >&2
            echo "Ensure Railway PR Environments are enabled in Project Settings -> Environments." >&2
            exit 1
          fi

          echo "Resolved preview environment: $PREVIEW_ENV"

          ATTEMPTS=20
          for i in $(seq 1 "$ATTEMPTS"); do
            railway status --project "$RAILWAY_PROJECT_ID" --environment "$PREVIEW_ENV" --json > /tmp/railway-status.json

            URLS=$(python - <<'PY'
            import json

            with open('/tmp/railway-status.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

            web = ""
            admin = ""

            def service_domain(domains):
              if not isinstance(domains, dict):
                return ""
              for key in ("serviceDomains", "customDomains"):
                values = domains.get(key) or []
                if not isinstance(values, list):
                  continue
                for item in values:
                  if isinstance(item, dict):
                    for field in ("domain", "hostname", "name"):
                      val = item.get(field)
                      if isinstance(val, str) and val:
                        return val
                  elif isinstance(item, str) and item:
                    return item
              return ""

            def walk(node):
              if isinstance(node, dict):
                yield node
                for v in node.values():
                  yield from walk(v)
              elif isinstance(node, list):
                for v in node:
                  yield from walk(v)

            for obj in walk(data):
              name = obj.get("serviceName") if isinstance(obj, dict) else None
              if name == "web" and not web:
                web = service_domain(obj.get("domains"))
              if name == "admin" and not admin:
                admin = service_domain(obj.get("domains"))

            print(f"{web}|{admin}")
            PY
            )

            WEB_DOMAIN="${URLS%%|*}"
            ADMIN_DOMAIN="${URLS##*|}"

            if [ -n "$WEB_DOMAIN" ] && [ -n "$ADMIN_DOMAIN" ]; then
              echo "E2E_BASE_URL=https://$WEB_DOMAIN" >> "$GITHUB_ENV"
              echo "E2E_ADMIN_BASE_URL=https://$ADMIN_DOMAIN" >> "$GITHUB_ENV"
              echo "Resolved preview URLs: https://$WEB_DOMAIN and https://$ADMIN_DOMAIN"
              break
            fi

            if [ "$i" -eq "$ATTEMPTS" ]; then
              echo "ERROR: Preview URLs not ready for environment '$PREVIEW_ENV' after $ATTEMPTS attempts." >&2
              exit 1
            fi

            echo "Preview URLs not ready yet (attempt $i/$ATTEMPTS); retrying..."
            sleep 15
          done

      - name: Run PR preview smoke test
        env:
          E2E_DJANGO_ADMIN_PASSWORD: ${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
          E2E_ARTIFACT_DIR: playwright/.tmp
        run: pnpm exec playwright test --config=playwright.config.prod-smoke.ts --retries=1

      - name: Upload preview smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-smoke-artifacts
          path: |
            web/app/playwright/.tmp
            web/app/test-results
          if-no-files-found: ignore

  deploy-production:
    # Deploy the production stack from the IaC in .railway/railway.ts.
    # Requires the RAILWAY_TOKEN (project-scoped) GitHub secret and an
    # existing Railway project wired to this repo. Runs only after both test
    # jobs pass on main.
    needs: [python, typescript]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: MyTradePortal/Production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: .railway/package-lock.json

      - name: Cache Railway CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: railway-cli-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            railway-cli-${{ runner.os }}-

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Install IaC runner dependencies
        working-directory: .railway
        run: npm ci

      - name: Set production secrets from GitHub secrets
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          DJANGO_SUPERUSER_PASSWORD: ${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
        run: |
          if [ -n "$DJANGO_SUPERUSER_PASSWORD" ]; then
            railway variable set DJANGO_SUPERUSER_PASSWORD="$DJANGO_SUPERUSER_PASSWORD" --service admin --environment production
          else
            echo "WARNING: DJANGO_SUPERUSER_PASSWORD is not set in the MyTradePortal/Production environment."
            echo "         The Django superuser will not be rotated on this deploy."
          fi

      - name: Apply Railway configuration
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT: production
          RAILWAY_IAC_TS_BIN: .railway/node_modules/.bin/railway-iac-ts
        # --confirm-destructive is required because the IaC corrects region
        # drift for native DB plugins and re-attaches existing Docker volumes.
        # These are expected, pre-go-live changes.
        run: railway config apply --yes --confirm-destructive
