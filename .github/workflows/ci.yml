name: CI

# Mobile-beta scope. Runs the Python + mobile TypeScript quality gates on every
# PR/push, then deploys the api / admin / data-pipeline services (plus native
# databases, qdrant, minio) via Railway IaC on push to main.
#
# CI hard rules (see docs/ci-hard-rules.md):
# - No live LLM or Paddle calls from CI. This workflow never sets LLM_API_KEY /
#   OPENAI_API_KEY / PADDLE_API_KEY; the eval harness runs offline against
#   canned fixtures (services/api/evals) and LLM/Paddle-facing tests use mocks
#   or forged, locally-signed webhooks. Do not add provider credentials here.
# - Schema changes are gated by the schema-sync job below: the project has no
#   Alembic migrations (scripts/init_db.py is the single source of truth), so
#   the job proves the sync is idempotent and reconciles an older prod-like
#   schema instead of a classic up/down migration test.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mtp
          POSTGRES_PASSWORD: mtp
          POSTGRES_DB: mtp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mtp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.11.5
        ports:
          - 6333:6333
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://mtp:mtp@localhost:5432/mtp
      QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: |
          mypy services/api packages/shared/py
          mypy --config-file mypy-admin.ini services/admin

      - name: Test with pytest
        # Coverage floor: current main measures 70% (term-missing report in addopts).
        # Do not lower this; raise it when coverage improves.
        run: pytest --cov-fail-under=70

  schema-sync:
    # Migration gate (CI hard rules). This project has no Alembic migrations:
    # scripts/init_db.py is the single source of truth — it creates the schema
    # from the current SQLAlchemy models, reconciles missing columns on
    # existing tables, and applies RLS. A classic up/down migration test does
    # not apply, so this job proves the two properties a migration gate exists
    # for, against a fresh Postgres:
    #   1. Idempotency: a second run reconciles nothing (safe as a preDeploy).
    #   2. Reconcile: against a prod-like *older* schema (simulated by
    #      dropping a recently added column), the sync brings it forward.
    # There is no prod-like dump fixture in the repo (checked
    # services/api/tests and scripts/); if one is ever added, extend this job
    # to restore it and run init_db against the restored dump.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mtp
          POSTGRES_PASSWORD: mtp
          POSTGRES_DB: mtp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mtp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://mtp:mtp@localhost:5432/mtp
      # Keep the BI metadata database name unique per run; init_db creates it.
      METABASE_DB_NAME: metabase_ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: First schema sync (fresh database)
        run: python scripts/init_db.py

      - name: Second schema sync must reconcile nothing (idempotency proof)
        run: |
          OUTPUT=$(python scripts/init_db.py 2>&1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "\[init_db\] No missing columns to reconcile"

      - name: Reconcile an older prod-like schema
        # Simulate a production dump from an older release by dropping a
        # recently added column; the sync must re-add it (this is the "up"
        # direction of the migration gate).
        run: |
          psql "postgresql://mtp:mtp@localhost:5432/mtp" \
            -c 'ALTER TABLE quotes DROP COLUMN rounding_adjustment'
          OUTPUT=$(python scripts/init_db.py 2>&1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Adding missing column quotes.rounding_adjustment"
          psql "postgresql://mtp:mtp@localhost:5432/mtp" \
            -tAc "SELECT 1 FROM information_schema.columns \
                  WHERE table_name='quotes' AND column_name='rounding_adjustment'" \
            | grep -q 1

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        # Version comes from the root package.json "packageManager" field.

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          # pnpm workspace: the lockfile lives at the repo root, not in mobile/.
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared TS tokens
        # @mtp/shared-ts types resolve to dist/, which only exists after a build.
        working-directory: packages/shared/ts
        run: pnpm build

      - name: Type check
        run: pnpm exec tsc --noEmit

  deploy-production:
    # Deploy the mobile-beta stack from the IaC in .railway/railway.ts.
    # Requires the RAILWAY_TOKEN (project-scoped) GitHub secret and an
    # existing Railway project wired to this repo. Runs only after both
    # quality-gate jobs pass on main.
    needs: [python, mobile, schema-sync]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: MyTradePortal/Production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: .railway/package-lock.json

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Install IaC runner dependencies
        working-directory: .railway
        run: npm ci

      - name: Rotate Django superuser password (optional)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          DJANGO_SUPERUSER_PASSWORD: ${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
        run: |
          if [ -n "$DJANGO_SUPERUSER_PASSWORD" ]; then
            # GraphQL, not the CLI: v5.28+ rejects the CI project token.
            python3 scripts/ci/set_variable.py production admin \
              DJANGO_SUPERUSER_PASSWORD "$DJANGO_SUPERUSER_PASSWORD"
          else
            echo "DJANGO_SUPERUSER_PASSWORD not set in MyTradePortal/Production; superuser will not be rotated on this deploy."
          fi

      - name: Apply Railway configuration
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT: production
          RAILWAY_IAC_TS_BIN: .railway/node_modules/.bin/railway-iac-ts
        # --confirm-destructive is required because the IaC corrects region
        # drift for native DB plugins and re-attaches existing Docker volumes.
        # These are expected, pre-go-live changes.
        run: |
          # Code deploys don't depend on this step — the Railway GitHub
          # integration rebuilds services on every push (verified on
          # 2026-09-16). What the CLI must accept here is the CI project
          # token, and v5.28+ rejects it with Invalid RAILWAY_TOKEN, so a
          # token rejection degrades to a loud warning instead of a red
          # deploy job; any other failure still fails.
          set +e
          OUTPUT=$(railway config apply --yes --confirm-destructive 2>&1)
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ]; then
            if echo "$OUTPUT" | grep -q "Invalid RAILWAY_TOKEN"; then
              echo "::warning::railway config apply skipped: the CI RAILWAY_TOKEN is rejected by the Railway CLI (v5.28+ rejects newer project tokens). IaC drift was NOT corrected — run 'railway config apply' locally with a logged-in session after any IaC change. Code deploys are unaffected."
              exit 0
            fi
            echo "$OUTPUT"
            exit "$CODE"
          fi
