name: Smoke Test

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      target:
        description: Smoke target environment
        type: choice
        required: true
        default: production
        options:
          - preview
          - production
      preview_env_label:
        description: Preview label (for example mytradeportal-pr-2) when target=preview
        required: false
      e2e_base_url:
        description: Optional override for E2E_BASE_URL
        required: false
      e2e_admin_base_url:
        description: Optional override for E2E_ADMIN_BASE_URL
        required: false
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

concurrency:
  group: smoke-test-${{ github.event_name == 'deployment_status' && (github.event.deployment.environment || github.event.deployment_status.environment) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'deployment_status' }}

jobs:
  smoke:
    if: ${{ (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web/app
    env:
      SMOKE_TARGET: ${{ (github.event_name == 'deployment_status' && (contains(github.event.deployment.environment || github.event.deployment_status.environment || '', 'pr-') && 'preview' || 'production')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'preview' && 'preview' || 'production') }}
      PREVIEW_ENV_LABEL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.preview_env_label || github.event.deployment.environment || github.event.deployment_status.environment || '' }}
      DEPLOYMENT_ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url || '' }}
      DEPLOYMENT_TARGET_URL: ${{ github.event.deployment_status.target_url || '' }}
      DEPLOYMENT_SHA: ${{ github.event.deployment.sha || '' }}
      MANUAL_E2E_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.e2e_base_url || '' }}
      MANUAL_E2E_ADMIN_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.e2e_admin_base_url || '' }}
      PROD_E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || '' }}
      PROD_E2E_ADMIN_BASE_URL: ${{ secrets.E2E_ADMIN_BASE_URL || '' }}
      E2E_DJANGO_ADMIN_USERNAME: ${{ secrets.E2E_DJANGO_ADMIN_USERNAME || 'superadmin' }}
      E2E_DJANGO_ADMIN_PASSWORD: ${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
      SETUP_TOKEN: ${{ secrets.SETUP_TOKEN || '' }}
      E2E_ARTIFACT_DIR: playwright/.tmp
    steps:
      - uses: actions/checkout@v4

      - name: Log smoke trigger
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "Smoke target: ${SMOKE_TARGET}"
          echo "Preview environment label: ${PREVIEW_ENV_LABEL:-unknown}"
          echo "Deployment SHA: ${DEPLOYMENT_SHA:-unknown}"
          echo "Deployment target URL: ${DEPLOYMENT_TARGET_URL:-unknown}"
          echo "Deployment environment URL: ${DEPLOYMENT_ENVIRONMENT_URL:-unknown}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            services/**/requirements.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/app/pnpm-lock.yaml

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/app/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install smoke dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -e "./[dev]"
          pnpm --dir web/app install --frozen-lockfile
          pnpm --dir web/app exec playwright install chromium

      - name: Resolve smoke URLs
        working-directory: .
        run: |
          set -euxo pipefail

          if [ -n "${MANUAL_E2E_BASE_URL:-}" ] && [ -n "${MANUAL_E2E_ADMIN_BASE_URL:-}" ]; then
            echo "E2E_BASE_URL=${MANUAL_E2E_BASE_URL}" >> "$GITHUB_ENV"
            echo "E2E_ADMIN_BASE_URL=${MANUAL_E2E_ADMIN_BASE_URL}" >> "$GITHUB_ENV"
            echo "Resolved smoke URLs from workflow_dispatch inputs"
            exit 0
          fi

          if [ "${SMOKE_TARGET}" = "preview" ]; then
            if [ -z "${PREVIEW_ENV_LABEL:-}" ]; then
              echo "ERROR: Preview environment label is missing." >&2
              exit 1
            fi

            # Railway PR-preview environment labels come through as
            # "<Project> / <preview-suffix>", where the suffix is the actual
            # subdomain fragment Railway allocates. The suffix used to be
            # "mytradeportal-pr-<n>" (matching the project + PR number), but
            # Railway now returns "pr-<hash>-<n>" (e.g. "pr-bf32ff-10"). Trim
            # anything before the last " / " so we work with the raw suffix
            # regardless of the format.
            PREVIEW_SUFFIX="${PREVIEW_ENV_LABEL##*/ }"
            PREVIEW_SUFFIX="${PREVIEW_SUFFIX## }"
            PREVIEW_SUFFIX="${PREVIEW_SUFFIX%% }"
            if [ -z "$PREVIEW_SUFFIX" ]; then
              echo "ERROR: Could not extract preview suffix from '$PREVIEW_ENV_LABEL'." >&2
              exit 1
            fi

            WEB_URL="https://web-$PREVIEW_SUFFIX.up.railway.app"
            ADMIN_URL="https://admin-$PREVIEW_SUFFIX.up.railway.app"

            echo "E2E_BASE_URL=$WEB_URL" >> "$GITHUB_ENV"
            echo "E2E_ADMIN_BASE_URL=$ADMIN_URL" >> "$GITHUB_ENV"
            echo "Resolved preview URLs from deterministic pattern: $WEB_URL and $ADMIN_URL"
            exit 0
          fi

          if [ -z "${PROD_E2E_BASE_URL:-}" ] || [ -z "${PROD_E2E_ADMIN_BASE_URL:-}" ]; then
            echo "ERROR: Production smoke requires E2E_BASE_URL and E2E_ADMIN_BASE_URL secrets." >&2
            exit 1
          fi

          echo "E2E_BASE_URL=${PROD_E2E_BASE_URL}" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_BASE_URL=${PROD_E2E_ADMIN_BASE_URL}" >> "$GITHUB_ENV"
          echo "Resolved production URLs from secrets"

      - name: Run smoke test
        run: pnpm exec playwright test --config=playwright.config.prod-smoke.ts --retries=1

      - name: Upload smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts-${{ env.SMOKE_TARGET }}
          path: |
            web/app/playwright/.tmp
            web/app/test-results
          if-no-files-found: ignore

      - name: Teardown smoke test data (production only)
        if: always() && env.SMOKE_TARGET == 'production'
        working-directory: .
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python services/admin/scripts/cleanup_e2e_prod.py
