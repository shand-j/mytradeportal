name: Agentic Penetration Test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Public web UI URL to attack (e.g. https://web-production-XXXX.up.railway.app)"
        required: true
        type: string
      api_base_url:
        description: "API base URL (e.g. https://api-production-XXXX.up.railway.app)"
        required: true
        type: string
      admin_base_url:
        description: "Django admin base URL (e.g. https://admin-production-XXXX.up.railway.app)"
        required: true
        type: string

concurrency:
  group: agentic-pen-test
  cancel-in-progress: false

jobs:
  agentic-pen-test:
    runs-on: ubuntu-latest
    environment: MyTradePortal/Production
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
      LLM_TIMEOUT_SECONDS: "300"
      SECURITY_TARGET_URL: ${{ github.event.inputs.target_url }}
      SECURITY_API_BASE_URL: ${{ github.event.inputs.api_base_url }}
      SECURITY_ADMIN_BASE_URL: ${{ github.event.inputs.admin_base_url }}
      AGENT_ARTIFACT_DIR: security/reports
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run agentic penetration test
        run: python -m security.agents.orchestrator

      - name: Upload pen-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pen-test-reports
          path: security/reports/*.json
          if-no-files-found: ignore
