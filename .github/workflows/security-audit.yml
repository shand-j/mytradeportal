name: Security Audit

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production

concurrency:
  group: security-audit
  cancel-in-progress: false

jobs:
  security-tests:
    name: OWASP / Multi-Tenancy / SOC2 Tests
    runs-on: ubuntu-latest
    environment: MyTradePortal/Production
    env:
      SECURITY_ENVIRONMENT: ${{ inputs.target }}
      SECURITY_API_BASE_URL: ${{ secrets.SECURITY_API_BASE_URL }}
      SECURITY_WEB_BASE_URL: ${{ secrets.SECURITY_WEB_BASE_URL }}
      SECURITY_ADMIN_BASE_URL: ${{ secrets.SECURITY_ADMIN_BASE_URL }}
      SECURITY_TENANT_SLUG: ${{ secrets.SECURITY_TENANT_SLUG }}
      SECURITY_ADMIN_EMAIL: ${{ secrets.SECURITY_ADMIN_EMAIL }}
      SECURITY_ADMIN_PASSWORD: ${{ secrets.SECURITY_ADMIN_PASSWORD }}
      SECURITY_SECONDARY_TENANT_SLUG: ${{ secrets.SECURITY_SECONDARY_TENANT_SLUG }}
      SECURITY_SECONDARY_ADMIN_EMAIL: ${{ secrets.SECURITY_SECONDARY_ADMIN_EMAIL }}
      SECURITY_SECONDARY_ADMIN_PASSWORD: ${{ secrets.SECURITY_SECONDARY_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run security tests
        run: pytest -m security -v --no-cov

      - name: Run pip-audit
        run: pip-audit --desc --audit-level=high

  dependency-audit:
    name: Node Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web/app
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        working-directory: web/app
        run: pnpm audit --audit-level=high
