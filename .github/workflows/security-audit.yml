name: Security Audit

on:
  # SOC2 CC4.1 (ongoing monitoring): run the audit weekly against production,
  # not just on demand. Monday 06:17 UTC (off the :00/:30 herd marks).
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

concurrency:
  group: security-audit
  cancel-in-progress: false

jobs:
  security-audit:
    runs-on: ubuntu-latest
    environment: MyTradePortal/Production
    env:
      # Scheduled runs carry no inputs; they always target production.
      SECURITY_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
      SECURITY_API_BASE_URL: ${{ secrets.SECURITY_API_BASE_URL }}
      SECURITY_WEB_BASE_URL: ${{ secrets.SECURITY_WEB_BASE_URL }}
      SECURITY_ADMIN_BASE_URL: ${{ secrets.SECURITY_ADMIN_BASE_URL }}
      SECURITY_TENANT_SLUG: ${{ secrets.SECURITY_TENANT_SLUG }}
      SECURITY_ADMIN_EMAIL: ${{ secrets.SECURITY_ADMIN_EMAIL }}
      SECURITY_ADMIN_PASSWORD: ${{ secrets.SECURITY_ADMIN_PASSWORD }}
      SECURITY_SECONDARY_TENANT_SLUG: ${{ secrets.SECURITY_SECONDARY_TENANT_SLUG }}
      SECURITY_SECONDARY_ADMIN_EMAIL: ${{ secrets.SECURITY_SECONDARY_ADMIN_EMAIL }}
      SECURITY_SECONDARY_ADMIN_PASSWORD: ${{ secrets.SECURITY_SECONDARY_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate security test configuration
        run: |
          python - <<'PY'
          import os
          required = ["SECURITY_API_BASE_URL", "SECURITY_TENANT_SLUG", "SECURITY_ADMIN_EMAIL", "SECURITY_ADMIN_PASSWORD"]
          missing = [k for k in required if not os.environ.get(k)]
          if missing:
              print("Missing required secrets for the security audit:")
              for k in missing:
                  print(f"  - {k}")
              print("Create a dedicated test tenant in the Django admin UI and set these secrets before running.")
              raise SystemExit(1)
          print("Security test configuration OK")
          PY

      - name: Run security tests
        run: pytest -m security -v

      - name: Run SOC2 evidence tests
        run: pytest -m security security/tests/test_soc2.py -v
