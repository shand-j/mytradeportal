packages:
  - 'packages/*'
  - 'packages/**/*'
  - 'mobile'
  - 'mobile/*'
  - 'web/app'
  - 'web/landing'

overrides:
  react-dom: 19.2.3
  # Security overrides (issue #53) — all confined to transitive dev/build
  # tooling (supabase CLI, Expo build tools, Next's pinned postcss, Appium
  # e2e). extract-zip and image-size have no patched release and are
  # documented in the PR instead.
  'tar@>=7.0.0': '>=7.5.19'
  'tar-fs@>=3.0.0 <3.1.1': '>=3.1.1'
  'ws@>=8.0.0 <8.17.1': '>=8.17.1'
  'serialize-javascript@<7.0.3': '>=7.0.3'
  'js-yaml@>=4.0.0 <4.3.2': '^4.3.2'
  'postcss@<8.5.12': '>=8.5.12'
  '@xmldom/xmldom@>=0.7.0 <0.9.0': '~0.8.15'
  '@xmldom/xmldom@>=0.9.0 <0.9.12': '~0.9.12'
  'deepmerge-ts@<8.0.0': '>=8.0.0'

# High-severity advisories accepted for now (issue #53) — no patched release
# exists and both are confined to local dev tooling, so the CI audit gate
# (pnpm audit --audit-level=high in pr-verify.yml) ignores exactly these IDs
# and still fails on any NEW high/critical advisory:
# - extract-zip@2.0.1 (latest, unmaintained) via e2e-appium devtools 8 →
#   @puppeteer/browsers. Only ever extracts browser binaries downloaded from
#   Google's official endpoints during local Appium e2e setup.
# - image-size@1.2.1 via metro (RN bundler, dev-time). The fix line (2.0.3+)
#   drops the file-path API metro's Assets.js requires, so forcing it breaks
#   bundling; exploitation needs a malicious image committed to the repo.
auditConfig:
  ignoreGhsas:
    - GHSA-7pqw-9j4j-h8q3 # extract-zip arbitrary file write via symlink entries
    - GHSA-jmr9-qjv8-65gv # extract-zip unvalidated symlink path traversal
    - GHSA-5p2g-fcmc-qvqq # image-size JXL/HEIF parser infinite-loop DoS
    - GHSA-w3rx-r6r6-pgpr # image-size ICNS parser infinite-loop DoS

onlyBuiltDependencies:
  - supabase
