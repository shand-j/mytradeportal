# Compose override for the mobile connected-mode E2E stack.
#
# Disables rate limiting so a suite's own repeated logins don't trip the
# per-IP auth limit. This keeps the E2E self-contained and matches CI.
# Used by mobile/e2e/start-stack.sh.
services:
  api:
    environment:
      RATE_LIMIT_ENABLED: "false"
