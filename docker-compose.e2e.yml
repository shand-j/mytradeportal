# Compose override for the mobile connected-mode E2E stack.
#
# Forces LOCAL bcrypt/JWT auth by blanking the Supabase credentials that a
# developer's root .env may set, and disables rate limiting so a suite's own
# repeated logins don't trip the per-IP auth limit. This keeps the E2E
# self-contained and matches CI, where no Supabase instance is running. Used by
# mobile/e2e/start-stack.sh.
services:
  api:
    environment:
      SUPABASE_URL: ""
      SUPABASE_ANON_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      RATE_LIMIT_ENABLED: "false"
