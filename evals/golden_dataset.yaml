# Golden Dataset for Domestic Electrical AI Quoting Agent Evaluation
# ================================================================
# This dataset provides ground-truth expected outputs for testing the AI
# quoting agent's ability to parse job descriptions, extract BOMs, and
# generate accurate domestic electrical quotes.
#
# SOURCES:
# - BS 7671:2018+A2:2022 (18th Edition Wiring Regulations)
# - Building Regulations Part P & Approved Document P
# - BS 5839-6:2019 (Fire Detection in Domestic Premises)
# - Electrical Safety First Minimum Socket Provision Guidance
# - NICEIC / NAPIT best practice guidance
# - Industry pricing data (Checkatrade, MyBuilder, TradeCalcs 2025)
# - Typical electrician BOM quantities (Learn Electrics, NICEIC training)
#
# Each test case includes:
#   - id: Unique test identifier
#   - category: Test category (standard_rewire, consumer_unit, extension, etc.)
#   - difficulty: easy / medium / hard / edge_case
#   - input: Natural language job description (what the user types)
#   - expected: Ground-truth expected output
#   - pass_criteria: Specific assertions the agent must satisfy
#   - notes: Rationale and domain context

meta:
  version: "1.0.0"
  created: "2026-06-23"
  total_cases: 25
  coverage:
    property_types: [1_bed_flat, 2_bed_house, 3_bed_semi, 3_bed_detached, 4_bed_detached]
    job_types: [full_rewire, consumer_unit_upgrade, kitchen_only, extension, ev_charger, garage_unit]
    spec_levels: [budget, mid_range, premium]
    regulatory_flags: [spd_required, afdd_required, smoke_alarms_required, metal_cu_required, rcd_protection]

# ================================================================
# CATEGORY 1: STANDARD FULL REWIRES
# ================================================================

