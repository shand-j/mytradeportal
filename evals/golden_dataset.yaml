      - "bom must contain consumer unit (quantity >= 1)"
      - "bom must contain at least 10 double sockets"
      - "bom must contain at least 4 light points (ceiling roses or downlights)"
      - "bom must contain at least 2 smoke/heat detectors"
      - "bom must contain SPD or flag spd_required"
      - "spec_level must be 'budget' or 'mid_range' (standard white = budget)"
      - "total material cost must be between GBP 500 and GBP 800"
    notes: >
      1-bed flat: living room, bedroom, kitchen, bathroom, hall. 
      Standard provision: 12 sockets, 4-5 light points, 1 CU, 3 MCBs.
      Per BS 5839-6: 2 smoke alarms (hall + living) + 1 heat (kitchen) minimum.
      SPD mandatory on all new CUs since 18th Ed (BS 7671 443.4).
      Source: TradeCalcs 2025 pricing, BS 7671:2018+A2:2022, BS 5839-6:2019.

