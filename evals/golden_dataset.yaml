        - description: "PVC mini trunking 16x16mm 3m"
          quantity: 5
          category: "conduit_trunking"
      estimated_material_cost_ex_vat:
        min: 550
        max: 750
      estimated_labour_hours:
        min: 20
        max: 30
      regulatory_flags:
        - "spd_required"
        - "smoke_alarms_required"
        - "metal_cu_required"
        - "rcd_protection"
      total_quote_range_ex_vat:
        min: 1700
        max: 2500
