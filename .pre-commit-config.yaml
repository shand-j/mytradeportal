repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [types-passlib, types-python-jose]
        args: [services/api, packages/shared/py]

  - repo: local
    hooks:
      - id: python-ci-checks
        name: Python CI-equivalent checks
        entry: bash -lc 'source .venv/bin/activate && ruff check . && ruff format --check . && mypy services/api packages/shared/py && mypy --config-file mypy-admin.ini services/admin && pytest'
        language: system
        pass_filenames: false
      - id: typescript-ci-checks
        name: TypeScript CI-equivalent checks
        entry: bash -lc 'pnpm --dir web/app lint && pnpm --dir web/app test && pnpm --dir web/app build'
        language: system
        pass_filenames: false
