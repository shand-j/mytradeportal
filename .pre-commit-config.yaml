default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^web/app/tsconfig\.(app|node)\.json$
      - id: check-added-large-files
        exclude: ^services/pwa/demo-video/.*\.mp4$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: python-ci-checks
        name: Python CI-equivalent checks
        entry: bash -lc 'set -euo pipefail; if [ -f .venv/bin/activate ]; then source .venv/bin/activate; fi; ruff check .; ruff format --check .; mypy services/api packages/shared/py; mypy --config-file mypy-admin.ini services/admin; pytest'
        language: system
        pass_filenames: false
        stages: [pre-push]
        require_serial: true
      - id: typescript-ci-checks
        name: TypeScript CI-equivalent checks
        entry: bash -lc 'unset VITE_API_BASE_URL && pnpm --dir web/app lint && pnpm --dir web/app test && pnpm --dir web/app build'
        language: system
        pass_filenames: false
        stages: [pre-push]
        require_serial: true
