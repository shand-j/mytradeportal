[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-trade-portal-v2"
version = "2.0.0"
description = "AI-native field service management platform — UK electrician MVP"
requires-python = ">=3.11"
dependencies = [
    # Core API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.0.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    # Cache / tasks
    "redis>=5.0.0",
    "celery>=5.4.0",
    # Vector search
    "qdrant-client>=1.9.0",
    # AI / LLM
    "litellm>=1.40.0",
    "openai>=1.30.0",
    # Data ingestion
    "pyarrow>=16.0.0",
    # Storage / utilities
    "boto3>=1.34.0",
    "fpdf2>=2.7.0",
    "aiosmtplib>=3.0.0",
    "paddle-python-sdk>=1.14.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Rate limiting
    "slowapi>=0.1.9",
    # Observability
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "newrelic>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0,<2.2.0",
    "pre-commit>=3.7.0",
    "types-passlib",
    "types-python-jose",
    "django-stubs[compatible-mypy]>=5.0",
    "django-environ>=0.11.2",
    "httpx>=0.27.0",
    "pip-audit>=2.7.0",
]

[tool.setuptools.packages.find]
where = ["packages/shared/py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "TCH", "TID", "RUF"
]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"services/admin/**/*.py" = ["RUF012"]
"security/**/*.py" = ["RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
exclude = ["*.md", "**/*.md"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "operations.*"
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "admin_project.*"
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "app.ingest_ddc_uk"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "app.pdf"
disallow_subclassing_any = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "app.security"
warn_return_any = false

[[tool.mypy.overrides]]
module = "app.main"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "app.qdrant"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["app.routers.auth", "app.routers.feature_flags", "app.routers.quotes"]
disallow_untyped_decorators = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "security.*"
disallow_any_generics = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services", "packages", "evals", "security"]
addopts = "-m 'not eval and not security' --cov=services --cov=packages --cov-report=term-missing"
markers = [
    "eval: Golden-dataset end-to-end evaluation against the OCERP service",
    "security: Security tests that require live target credentials and are not run by default",
]

[tool.coverage.run]
source = ["services", "packages", "security"]
omit = ["*/tests/*", "*/test_*"]
